name: Deploy to UAT

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows a manual re-deploy from the Actions tab

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image owner (GHCR requires lowercase repo paths)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/it-ticketing-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/it-ticketing-backend:uat-latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/it-ticketing-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/it-ticketing-frontend:uat-latest

  deploy:
    runs-on: [self-hosted, uat]
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Pull & restart the UAT stack
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose --env-file /opt/it-ticketing/.env.uat \
            -f docker-compose.uat.yml pull
          docker compose --env-file /opt/it-ticketing/.env.uat \
            -f docker-compose.uat.yml up -d --remove-orphans

      - name: Health check
        run: |
          # https + -k (self-signed cert, see Caddyfile - Entra requires
          # https:// on this box, plain http was removed entirely).
          # Caddy now routes by hostname (FRONTEND_HOST/BACKEND_HOST), not
          # by port, so this needs the real hostnames - --resolve pins
          # them to 127.0.0.1 (this check runs on the same box Caddy is
          # on) so it works instantly regardless of external DNS
          # propagation timing.
          # Extract just the two vars needed, rather than `source`-ing the
          # whole file: .env.uat has unquoted values with spaces (e.g.
          # M365_FROM_NAME) which are valid for Docker's env-file parser
          # but not as literal bash (source blew up with "Health: command
          # not found", exit 127, treating `Health Center IT Helpdesk` as
          # a command). This also avoids loading unrelated secrets into
          # this step's environment.
          FRONTEND_HOST=$(grep -oP '^FRONTEND_HOST=\K.*' /opt/it-ticketing/.env.uat)
          BACKEND_HOST=$(grep -oP '^BACKEND_HOST=\K.*' /opt/it-ticketing/.env.uat)
          for i in $(seq 1 15); do
            curl --fail -sk --resolve "${BACKEND_HOST}:443:127.0.0.1" "https://${BACKEND_HOST}/docs" > /dev/null && backend_ok=1 && break
            sleep 2
          done
          for i in $(seq 1 15); do
            curl --fail -sk --resolve "${FRONTEND_HOST}:443:127.0.0.1" "https://${FRONTEND_HOST}/login" > /dev/null && frontend_ok=1 && break
            sleep 2
          done
          if [ -z "$backend_ok" ] || [ -z "$frontend_ok" ]; then
            echo "Health check failed - backend_ok=$backend_ok frontend_ok=$frontend_ok"
            docker compose --env-file /opt/it-ticketing/.env.uat -f docker-compose.uat.yml logs --tail=100
            exit 1
          fi
          echo "UAT deploy healthy."
