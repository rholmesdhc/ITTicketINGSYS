services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - only reachable from other containers on
    # this compose network.

  backend:
    image: ghcr.io/${GHCR_OWNER}/it-ticketing-backend:${TAG:-uat-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # --- Entra ID login (see backend/entra_auth.py) ---
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_MCP_CLIENT_ID: ${ENTRA_MCP_CLIENT_ID}
      ENTRA_WEB_APP_CLIENT_ID: ${ENTRA_WEB_APP_CLIENT_ID}
      ENTRA_ADMIN_GROUP_ID: ${ENTRA_ADMIN_GROUP_ID}
      ENTRA_TECH_GROUP_ID: ${ENTRA_TECH_GROUP_ID}
      # --- Email notifications (see backend/mailer.py) ---
      ENTRA_MAIL_CLIENT_ID: ${ENTRA_MAIL_CLIENT_ID}
      ENTRA_MAIL_CLIENT_SECRET: ${ENTRA_MAIL_CLIENT_SECRET}
      M365_FROM_NAME: ${M365_FROM_NAME}
      M365_FROM_ADDRESS: ${M365_FROM_ADDRESS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    # Not published directly to the host anymore - caddy is the only
    # thing bound to 8005 now (see below), terminating TLS in front of it.
    expose:
      - "8005"
    volumes:
      # Employee seed CSV (real staff PII) never ships in the image or
      # touches git - copy it onto the box once, seed_users.py reads it
      # from here. See .env.uat.example for SEED_DATA_DIR.
      - ${SEED_DATA_DIR:-/opt/it-ticketing/data}:/app/data:ro

  frontend:
    image: ghcr.io/${GHCR_OWNER}/it-ticketing-frontend:${TAG:-uat-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # NextAuth reads these at request time, not build time (unlike
      # NEXT_PUBLIC_API_BASE_URL, which is baked into the image at build -
      # see deploy-uat.yml) - missing this block entirely used to mean
      # Entra login would silently fail on UAT with no build-time signal
      # that anything was wrong.
      AUTH_SECRET: ${AUTH_SECRET}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      # Explicit, not auto-detected - behind the Caddy reverse proxy,
      # NextAuth's automatic base-URL detection isn't reliable (it built
      # https://0.0.0.0:3005/... instead of the real IP on the first live
      # attempt, which Entra rejected as a redirect-URI mismatch). This
      # removes the ambiguity entirely.
      AUTH_URL: https://${UAT_HOST}:3005
    # Not published directly to the host anymore - see caddy below.
    expose:
      - "3005"

  # Entra requires redirect URIs to be https:// (or exactly
  # http://localhost) - it flatly rejects plain http:// on any other
  # host, including private IPs. This terminates TLS (self-signed, see
  # Caddyfile) in front of both frontend and backend so Entra login can
  # work on UAT at all; the app containers themselves are unchanged and
  # still speak plain HTTP internally.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      UAT_HOST: ${UAT_HOST}
    ports:
      - "3005:3005"
      - "8005:8005"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  caddy_data:
